<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cevio To-Do</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 60%, rgba(138, 103, 255, 0.15), transparent 50%), #040408;
      font-family: "Outfit", sans-serif;
      color: white;
    }

    /* grosser CEVIO-Schriftzug im Hintergrund */
    .bg-text {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      font-family: "Syne", sans-serif;
      font-size: 18vw;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .app {
      position: relative;
      width: 480px;
      max-width: 90vw;
      padding: 36px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.6em;
      background: rgba(18, 18, 26, 0.9);
      backdrop-filter: blur(6px);
    }

    .label {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #8a67ff;
    }

    h1 {
      margin: 8px 0 24px;
      font-family: "Syne", sans-serif;
      font-size: 40px;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8a67ff;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Button wie "Projekt starten" */
    #add {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 20px;
      border: none;
      border-radius: 999px;
      background: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    #add span {
      width: 34px;
      height: 34px;
      line-height: 34px;
      border-radius: 50%;
      background: #8a67ff;
      color: white;
      font-size: 22px;
    }

    .progress {
      height: 4px;
      margin: 24px 0 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    #bar {
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8a67ff, #5e3fe6);
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #counter {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.55);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
      counter-reset: todo;
    }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.9em;
      background: rgba(255, 255, 255, 0.03);
      counter-increment: todo;
      animation: slideIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      transition: background 0.2s, border-color 0.2s;
    }

    li:hover {
      background: rgba(138, 103, 255, 0.08);
      border-color: rgba(138, 103, 255, 0.3);
    }

    /* Nummer 01, 02, 03 ... */
    li::before {
      content: counter(todo, decimal-leading-zero);
      font-weight: 300;
      color: #8a67ff;
      letter-spacing: 0.08em;
    }

    li span {
      flex: 1;
      font-weight: 300;
      cursor: pointer;
    }

    li.done span {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.35);
    }

    li button {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    li button:hover {
      background: #8a67ff;
      border-color: #8a67ff;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
    }
  </style>
</head>
<body>
  <div class="bg-text">
    <span>C</span><span>E</span><span>V</span><span>I</span><span>O</span>
  </div>

  <div class="app">
    <p class="label">Cevio Workspace</p>
    <h1>Meine To-Dos</h1>
    <div class="input-row">
      <input id="input" placeholder="Neue Aufgabe ...">
      <button id="add">Hinzufügen <span>+</span></button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <p id="counter"></p>
    <ul id="list"></ul>
  </div>

  <script>
    const input = document.getElementById("input");
    const addButton = document.getElementById("add");
    const list = document.getElementById("list");
    const counter = document.getElementById("counter");
    const bar = document.getElementById("bar");

    // gespeicherte Aufgaben laden
    let todos = JSON.parse(localStorage.getItem("todos")) || [];

    function save() {
      localStorage.setItem("todos", JSON.stringify(todos));

      const done = todos.filter((todo) => todo.done).length;
      const open = todos.length - done;
      counter.textContent = open === 0 ? "Alles erledigt" : open + " offen";
      bar.style.width = todos.length ? (done / todos.length) * 100 + "%" : "0";
    }

    function show(todo) {
      const li = document.createElement("li");
      li.classList.toggle("done", todo.done);

      // Klick auf den Text = abhaken
      const text = document.createElement("span");
      text.textContent = todo.text;
      text.addEventListener("click", () => {
        todo.done = !todo.done;
        li.classList.toggle("done", todo.done);
        save();
      });

      // Klick auf x = loeschen
      const removeButton = document.createElement("button");
      removeButton.innerHTML = "&times;";
      removeButton.addEventListener("click", () => {
        todos = todos.filter((item) => item !== todo);
        li.remove();
        save();
      });

      li.append(text, removeButton);
      list.append(li);
    }

    function addTodo() {
      const text = input.value.trim();
      if (text === "") return;

      const todo = { text: text, done: false };
      todos.push(todo);
      show(todo);
      save();
      input.value = "";
      input.focus();
    }

    addButton.addEventListener("click", addTodo);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addTodo();
    });

    todos.forEach(show);
    save();
  </script>
</body>
</html>

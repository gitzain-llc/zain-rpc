<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cevio Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 60px 24px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(138, 103, 255, 0.18), transparent 60%), #040408;
      font-family: "Outfit", sans-serif;
      color: white;
    }

    /* grosser CEVIO-Schriftzug im Hintergrund */
    .bg-text {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      font-family: "Syne", sans-serif;
      font-size: 18vw;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .app {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
    }

    .label {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #8a67ff;
    }

    h1 {
      margin: 8px 0 24px;
      font-family: "Syne", sans-serif;
      font-size: 48px;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8a67ff;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Button wie "Projekt starten" */
    #add {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 20px;
      border: none;
      border-radius: 999px;
      background: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    #add span {
      width: 34px;
      height: 34px;
      line-height: 34px;
      border-radius: 50%;
      background: #8a67ff;
      color: white;
      font-size: 22px;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .column {
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.6em;
      background: rgba(18, 18, 26, 0.9);
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      font-family: "Syne", sans-serif;
      font-size: 22px;
    }

    h2 span {
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(138, 103, 255, 0.15);
      color: #b89cff;
      font-family: "Outfit", sans-serif;
      font-size: 14px;
      font-weight: 400;
    }

    /* Filme als Raster aus Plakaten */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 20px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .grid:empty::before {
      content: "Noch keine Filme";
      grid-column: 1 / -1;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.35);
    }

    .card {
      position: relative;
      animation: slideIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .poster {
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 2 / 3;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: linear-gradient(165deg, #8a67ff, #5e3fe6) center / cover;
      font-family: "Syne", sans-serif;
      font-size: 48px;
      text-transform: uppercase;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s, filter 0.4s;
    }

    .card:hover .poster {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(138, 103, 255, 0.35);
    }

    .card h3 {
      margin: 12px 0 2px;
      font-family: "Syne", sans-serif;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card p {
      min-height: 1.2em;
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.55);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .toggle {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: none;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .remove {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .toggle:hover,
    .remove:hover {
      background: #8a67ff;
      border-color: #8a67ff;
    }

    /* waehrend das Plakat geladen wird */
    .loading .poster {
      animation: pulse 0.8s infinite alternate;
    }

    .loading .actions {
      opacity: 0.3;
      pointer-events: none;
    }

    /* gesehene Filme: grau mit Badge */
    #watchedList .poster {
      filter: grayscale(1) brightness(0.6);
    }

    #watchedList .card:hover .poster {
      filter: none;
    }

    #watchedList .card::before {
      content: "Gesehen";
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      padding: 4px 10px;
      border-radius: 999px;
      background: #8a67ff;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
    }

    @keyframes pulse {
      from {
        opacity: 0.3;
      }
    }

    /* Handy: Spalten untereinander */
    @media (max-width: 800px) {
      .columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="bg-text">
    <span>C</span><span>E</span><span>V</span><span>I</span><span>O</span>
  </div>

  <div class="app">
    <p class="label">Cevio Movies</p>
    <h1>Meine Filmliste</h1>

    <div class="input-row">
      <input id="input" placeholder="Filmtitel eingeben, z. B. Interstellar">
      <button id="add">Hinzufügen <span>+</span></button>
    </div>

    <div class="columns">
      <section class="column">
        <h2>Will ich sehen <span id="watchCount">0</span></h2>
        <ul class="grid" id="watchList"></ul>
      </section>
      <section class="column">
        <h2>Gesehen <span id="watchedCount">0</span></h2>
        <ul class="grid" id="watchedList"></ul>
      </section>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const addButton = document.getElementById("add");
    const watchList = document.getElementById("watchList");
    const watchedList = document.getElementById("watchedList");
    const watchCount = document.getElementById("watchCount");
    const watchedCount = document.getElementById("watchedCount");

    // gespeicherte Filme laden
    let movies = JSON.parse(localStorage.getItem("movies")) || [];

    function save() {
      localStorage.setItem("movies", JSON.stringify(movies));

      const watched = movies.filter((movie) => movie.watched).length;
      watchedCount.textContent = watched;
      watchCount.textContent = movies.length - watched;
    }

    // Plakat, richtigen Titel und Jahr bei Wikipedia suchen
    async function findMovie(title) {
      const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*"
        + "&generator=search&gsrlimit=1&prop=pageimages|description&piprop=original&pilicense=any"
        + "&gsrsearch=" + encodeURIComponent(title + " film");

      const response = await fetch(url);
      const data = await response.json();
      if (!data.query) return null;

      // nur Treffer nehmen, die wirklich ein Film sind
      const page = data.query.pages[0];
      const description = page.description || "";
      if (!description.toLowerCase().includes("film")) return null;

      const year = description.match(/\d{4}/);
      return {
        title: page.title.split(" (")[0],
        year: year ? year[0] : "",
        poster: page.original ? page.original.source : ""
      };
    }

    function createCard(movie) {
      const card = document.createElement("li");
      card.className = "card";

      // Plakat, oder der Anfangsbuchstabe, falls kein Bild gefunden wurde
      const poster = document.createElement("div");
      poster.className = "poster";
      if (movie.poster) {
        poster.style.backgroundImage = 'url("' + movie.poster + '")';
      } else {
        poster.textContent = movie.title[0];
      }

      const title = document.createElement("h3");
      title.textContent = movie.title;

      const year = document.createElement("p");
      year.textContent = movie.year;

      // Film in die andere Spalte verschieben
      const toggleButton = document.createElement("button");
      toggleButton.className = "toggle";
      toggleButton.textContent = movie.watched ? "Nochmal" : "Gesehen";
      toggleButton.addEventListener("click", () => {
        movie.watched = !movie.watched;
        movies = movies.filter((item) => item !== movie);
        movies.push(movie); // ans Ende der Liste
        card.remove();
        show(movie);
        save();
      });

      // Film loeschen
      const removeButton = document.createElement("button");
      removeButton.className = "remove";
      removeButton.innerHTML = "&times;";
      removeButton.addEventListener("click", () => {
        movies = movies.filter((item) => item !== movie);
        card.remove();
        save();
      });

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(toggleButton, removeButton);

      card.append(poster, title, year, actions);
      return card;
    }

    function show(movie) {
      const card = createCard(movie);
      const list = movie.watched ? watchedList : watchList;
      list.append(card);
      return card;
    }

    async function addMovie() {
      const title = input.value.trim();
      if (title === "") return;
      input.value = "";

      const movie = { title: title, year: "", poster: "", watched: false };
      movies.push(movie);
      save();

      // Platzhalter zeigen, waehrend das Plakat geladen wird
      const card = show(movie);
      card.classList.add("loading");
      card.querySelector("p").textContent = "Suche Plakat ...";

      try {
        const info = await findMovie(title);
        if (info) Object.assign(movie, info);
      } catch (error) {
        console.log("Plakat konnte nicht geladen werden:", error);
      }

      save();
      card.replaceWith(createCard(movie));
    }

    addButton.addEventListener("click", addMovie);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addMovie();
    });

    movies.forEach(show);
    save();
  </script>
</body>
</html>

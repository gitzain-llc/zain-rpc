<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cevio Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 50px 24px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(138, 103, 255, 0.18), transparent 60%), #040408;
      font-family: "Outfit", sans-serif;
      color: white;
    }

    /* grosser CEVIO-Schriftzug im Hintergrund */
    .bg-text {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      font-family: "Syne", sans-serif;
      font-size: 18vw;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .app {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .label {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #8a67ff;
    }

    h1 {
      margin: 8px 0 0;
      font-family: "Syne", sans-serif;
      font-size: 48px;
      letter-spacing: -0.02em;
    }

    /* Tabs oben rechts */
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.75);
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    .tab:hover {
      border-color: rgba(138, 103, 255, 0.5);
    }

    .tab.active {
      background: white;
      color: #040408;
    }

    .tab span {
      padding: 1px 8px;
      border-radius: 999px;
      background: #8a67ff;
      color: white;
      font-size: 12px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    #search {
      width: 100%;
      padding: 16px 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-family: inherit;
      font-size: 17px;
      outline: none;
    }

    #search:focus {
      border-color: #8a67ff;
      box-shadow: 0 0 0 4px rgba(138, 103, 255, 0.15);
    }

    #search::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    h2 {
      margin: 30px 0 20px;
      font-family: "Syne", sans-serif;
      font-size: 24px;
    }

    /* Raster aus Filmplakaten */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 24px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .list:empty::before {
      content: "Noch keine Filme. Entdecke welche!";
      grid-column: 1 / -1;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.4);
    }

    .card {
      position: relative;
      min-width: 0;
      animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .poster {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: linear-gradient(165deg, #8a67ff, #5e3fe6);
      font-family: "Syne", sans-serif;
      font-size: 48px;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s;
    }

    .poster img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card:hover .poster {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(138, 103, 255, 0.35);
    }

    .card h3 {
      margin: 12px 0 2px;
      font-family: "Syne", sans-serif;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card p {
      min-height: 1.2em;
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.55);
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .actions button {
      flex: 1;
      padding: 8px 6px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: none;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .actions button:hover {
      background: #8a67ff;
      border-color: #8a67ff;
    }

    .actions button:disabled {
      opacity: 0.45;
      background: none;
      border-color: rgba(255, 255, 255, 0.25);
      cursor: default;
    }

    .actions .round {
      flex: none;
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 18px;
    }

    /* Badge auf gesehenen Filmen */
    #watchedList .card::before {
      content: "Gesehen";
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      padding: 4px 10px;
      border-radius: 999px;
      background: #8a67ff;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
    }

    /* Handy */
    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-text">
    <span>C</span><span>E</span><span>V</span><span>I</span><span>O</span>
  </div>

  <div class="app">
    <header>
      <div>
        <p class="label">Cevio Movies</p>
        <h1>Meine Filme</h1>
      </div>
      <nav>
        <button class="tab active" data-view="discover">Entdecken</button>
        <button class="tab" data-view="watchlist">Will ich sehen <span id="watchCount">0</span></button>
        <button class="tab" data-view="watched">Gesehen <span id="watchedCount">0</span></button>
      </nav>
    </header>

    <section class="view active" id="discover">
      <input id="search" placeholder="Film suchen, z. B. Batman ...">
      <h2 id="galleryTitle">Beliebte Filme</h2>
      <ul class="grid" id="gallery"></ul>
    </section>

    <section class="view" id="watchlist">
      <ul class="grid list" id="watchList"></ul>
    </section>

    <section class="view" id="watched">
      <ul class="grid list" id="watchedList"></ul>
    </section>
  </div>

  <script>
    // beliebte Filme fuer die Galerie (so wie sie auf Wikipedia heissen)
    const POPULAR = [
      "Interstellar (film)",
      "Inception",
      "The Dark Knight",
      "Oppenheimer (film)",
      "Dune (2021 film)",
      "Dune: Part Two",
      "Barbie (film)",
      "Avatar (2009 film)",
      "Avatar: The Way of Water",
      "Avatar: Fire and Ash",
      "Titanic (1997 film)",
      "Avengers: Endgame",
      "Spider-Man: No Way Home",
      "Spider-Man: Across the Spider-Verse",
      "Joker (2019 film)",
      "The Batman (film)",
      "Top Gun: Maverick",
      "Fight Club",
      "The Matrix",
      "Pulp Fiction",
      "Forrest Gump",
      "The Godfather",
      "The Shawshank Redemption",
      "Parasite (2019 film)",
      "Inside Out 2",
      "Frozen (2013 film)",
      "Shrek",
      "Toy Story",
      "Up (2009 film)",
      "Coco (2017 film)",
      "Harry Potter and the Philosopher's Stone (film)",
      "The Lord of the Rings: The Fellowship of the Ring",
      "Star Wars (film)",
      "Jurassic Park (film)",
      "Gladiator (2000 film)",
      "The Wolf of Wall Street (2013 film)",
      "La La Land",
      "Wicked (2024 film)",
      "Deadpool & Wolverine",
      "Back to the Future",
      "Superman (2025 film)",
      "Sinners (2025 film)",
      "A Minecraft Movie",
      "F1 (film)",
      "Zootopia 2",
      "The Super Mario Galaxy Movie",
      "Mad Max: Fury Road",
      "John Wick (film)"
    ];

    // Wikipedia liefert Plakat, Titel und Beschreibung (mit Jahr), ohne API-Schluessel
    const API = "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*"
      + "&prop=pageimages|description&piprop=original&pilicense=any&redirects=1";

    const search = document.getElementById("search");
    const gallery = document.getElementById("gallery");
    const galleryTitle = document.getElementById("galleryTitle");
    const watchList = document.getElementById("watchList");
    const watchedList = document.getElementById("watchedList");
    const watchCount = document.getElementById("watchCount");
    const watchedCount = document.getElementById("watchedCount");

    // gespeicherte Filme laden
    let movies = JSON.parse(localStorage.getItem("movies")) || [];
    let popularFilms = [];
    let galleryFilms = [];

    async function loadFilms(params) {
      const response = await fetch(API + params);
      const data = await response.json();
      const pages = data.query ? data.query.pages : [];

      // nur Filme mit Plakat, in der Reihenfolge der Suchtreffer
      return pages
        .filter(isFilm)
        .sort((a, b) => a.index - b.index)
        .map(toFilm);
    }

    // einzelner Film? (keine Filmreihe wie "Fantasy film series" und keine Uebersichtsseite)
    function isFilm(page) {
      const description = (page.description || "").toLowerCase();
      return page.original
        && /\bfilm\b/.test(description) // das ganze Wort "film", nicht "filming"
        && !description.includes("series")
        && !description.includes("adaptations");
    }

    function toFilm(page) {
      // Jahr steht in der Beschreibung ("2014 film by ...") oder im Titel ("Dune (2021 film)")
      const year = (page.description + " " + page.title).match(/\d{4}/);
      return {
        title: page.title.split(" (")[0],
        year: year ? year[0] : "",
        poster: page.original.source
      };
    }

    function save() {
      localStorage.setItem("movies", JSON.stringify(movies));

      const watched = movies.filter((movie) => movie.watched).length;
      watchedCount.textContent = watched;
      watchCount.textContent = movies.length - watched;
      renderLists();
    }

    function findSaved(film) {
      return movies.find((movie) => movie.title === film.title);
    }

    function button(text, onClick, className) {
      const btn = document.createElement("button");
      btn.innerHTML = text;
      if (className) btn.className = className;
      if (onClick) btn.addEventListener("click", onClick);
      return btn;
    }

    function createCard(film, index) {
      const card = document.createElement("li");
      card.className = "card";
      card.style.animationDelay = index * 0.03 + "s";

      // Plakat mit Anfangsbuchstaben dahinter, falls das Bild fehlt
      const poster = document.createElement("div");
      poster.className = "poster";
      poster.textContent = film.title[0];

      if (film.poster) {
        const img = document.createElement("img");
        img.src = film.poster;
        img.loading = "lazy"; // erst laden, wenn man hinscrollt
        img.onerror = () => img.remove();
        poster.append(img);
      }

      const title = document.createElement("h3");
      title.textContent = film.title;

      const year = document.createElement("p");
      year.textContent = film.year;

      const actions = document.createElement("div");
      actions.className = "actions";

      card.append(poster, title, year, actions);
      return card;
    }

    // Buttons unter einem Film in der Galerie
    function fillGalleryActions(film, actions) {
      actions.innerHTML = "";
      const saved = findSaved(film);

      if (saved) {
        const status = button(saved.watched ? "Gesehen" : "Auf der Liste");
        status.disabled = true;
        actions.append(status);
        return;
      }

      actions.append(
        button("+ Merken", () => addFilm(film, false, actions)),
        button("Gesehen", () => addFilm(film, true, actions))
      );
    }

    function addFilm(film, watched, actions) {
      movies.push({ title: film.title, year: film.year, poster: film.poster, watched: watched });
      save();
      fillGalleryActions(film, actions);
    }

    function renderGallery(films) {
      galleryFilms = films;
      gallery.innerHTML = "";

      films.forEach((film, index) => {
        const card = createCard(film, index);
        fillGalleryActions(film, card.querySelector(".actions"));
        gallery.append(card);
      });
    }

    function renderLists() {
      watchList.innerHTML = "";
      watchedList.innerHTML = "";

      movies.forEach((movie, index) => {
        const card = createCard(movie, index);
        card.querySelector(".actions").append(
          button(movie.watched ? "Nochmal" : "Gesehen", () => {
            movie.watched = !movie.watched;
            save();
          }),
          button("&times;", () => {
            movies = movies.filter((item) => item !== movie);
            save();
          }, "round")
        );

        if (movie.watched) {
          watchedList.append(card);
        } else {
          watchList.append(card);
        }
      });
    }

    // Tabs wechseln
    for (const tab of document.querySelectorAll(".tab")) {
      tab.addEventListener("click", () => {
        document.querySelector(".tab.active").classList.remove("active");
        document.querySelector(".view.active").classList.remove("active");
        tab.classList.add("active");
        document.getElementById(tab.dataset.view).classList.add("active");

        if (tab.dataset.view === "discover") renderGallery(galleryFilms);
      });
    }

    // Suche: startet, sobald man kurz nicht mehr tippt
    let timer;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(runSearch, 400);
    });

    async function runSearch() {
      const query = search.value.trim();
      if (query === "") {
        galleryTitle.textContent = "Beliebte Filme";
        renderGallery(popularFilms);
        return;
      }

      galleryTitle.textContent = "Suche ...";
      try {
        const films = await loadFilms("&generator=search&gsrlimit=20&gsrsearch=" + encodeURIComponent(query + " film"));
        if (query !== search.value.trim()) return; // inzwischen weitergetippt

        // Filme mit genau dem gesuchten Titel zuerst (z. B. "Up" vor "Don't Look Up")
        const exact = (film) => film.title.toLowerCase() === query.toLowerCase();
        films.sort((a, b) => exact(b) - exact(a));

        galleryTitle.textContent = films.length ? 'Ergebnisse für "' + query + '"' : "Keine Filme gefunden";
        renderGallery(films);
      } catch (error) {
        galleryTitle.textContent = "Keine Verbindung zu Wikipedia";
      }
    }

    async function loadPopular() {
      galleryTitle.textContent = "Lade Filme ...";
      try {
        popularFilms = await loadFilms("&titles=" + encodeURIComponent(POPULAR.join("|")));
        popularFilms.sort((a, b) => b.year - a.year); // neueste zuerst

        if (search.value.trim() === "") {
          galleryTitle.textContent = "Beliebte Filme";
          renderGallery(popularFilms);
        }
      } catch (error) {
        galleryTitle.textContent = "Keine Verbindung zu Wikipedia";
      }
    }

    save();
    loadPopular();
  </script>
</body>
</html>

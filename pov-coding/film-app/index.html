<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cevio Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 60px 20px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(138, 103, 255, 0.15), transparent 50%), #040408;
      font-family: "Outfit", sans-serif;
      color: white;
    }

    /* grosser CEVIO-Schriftzug im Hintergrund */
    .bg-text {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      font-family: "Syne", sans-serif;
      font-size: 18vw;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .app {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    .label {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #8a67ff;
    }

    h1 {
      margin: 8px 0 24px;
      font-family: "Syne", sans-serif;
      font-size: 48px;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8a67ff;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Button wie "Projekt starten" */
    #add {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 20px;
      border: none;
      border-radius: 999px;
      background: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    #add span {
      width: 34px;
      height: 34px;
      line-height: 34px;
      border-radius: 50%;
      background: #8a67ff;
      color: white;
      font-size: 22px;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .column {
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.6em;
      background: rgba(18, 18, 26, 0.9);
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-family: "Syne", sans-serif;
      font-size: 22px;
    }

    h2 span {
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(138, 103, 255, 0.15);
      color: #b89cff;
      font-family: "Outfit", sans-serif;
      font-size: 14px;
      font-weight: 400;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* Text, wenn die Liste leer ist */
    ul:empty::before {
      content: "Noch keine Filme";
      font-weight: 300;
      color: rgba(255, 255, 255, 0.35);
    }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.9em;
      background: rgba(255, 255, 255, 0.03);
      animation: slideIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      transition: background 0.2s, border-color 0.2s;
    }

    li:hover {
      background: rgba(138, 103, 255, 0.08);
      border-color: rgba(138, 103, 255, 0.3);
    }

    /* kleines Film-Plakat mit dem ersten Buchstaben */
    .poster {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 42px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 8px;
      background: linear-gradient(165deg, #8a67ff, #5e3fe6);
      font-family: "Syne", sans-serif;
      font-size: 22px;
      text-transform: uppercase;
    }

    li span {
      flex: 1;
      font-weight: 300;
    }

    .toggle {
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: none;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .remove {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .toggle:hover,
    .remove:hover {
      background: #8a67ff;
      border-color: #8a67ff;
    }

    /* gesehene Filme etwas blasser */
    #watchedList .poster {
      background: rgba(255, 255, 255, 0.1);
    }

    #watchedList span {
      color: rgba(255, 255, 255, 0.5);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
    }

    /* Handy: Spalten untereinander */
    @media (max-width: 700px) {
      .columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="bg-text">
    <span>C</span><span>E</span><span>V</span><span>I</span><span>O</span>
  </div>

  <div class="app">
    <p class="label">Cevio Movies</p>
    <h1>Meine Filmliste</h1>

    <div class="input-row">
      <input id="input" placeholder="Filmtitel eingeben ...">
      <button id="add">Hinzufügen <span>+</span></button>
    </div>

    <div class="columns">
      <section class="column">
        <h2>Will ich sehen <span id="watchCount">0</span></h2>
        <ul id="watchList"></ul>
      </section>
      <section class="column">
        <h2>Gesehen <span id="watchedCount">0</span></h2>
        <ul id="watchedList"></ul>
      </section>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const addButton = document.getElementById("add");
    const watchList = document.getElementById("watchList");
    const watchedList = document.getElementById("watchedList");
    const watchCount = document.getElementById("watchCount");
    const watchedCount = document.getElementById("watchedCount");

    // gespeicherte Filme laden
    let movies = JSON.parse(localStorage.getItem("movies")) || [];

    function save() {
      localStorage.setItem("movies", JSON.stringify(movies));

      const watched = movies.filter((movie) => movie.watched).length;
      watchedCount.textContent = watched;
      watchCount.textContent = movies.length - watched;
    }

    function show(movie) {
      const li = document.createElement("li");

      const poster = document.createElement("div");
      poster.className = "poster";
      poster.textContent = movie.title[0];

      const title = document.createElement("span");
      title.textContent = movie.title;

      // Film in die andere Spalte verschieben
      const toggleButton = document.createElement("button");
      toggleButton.className = "toggle";
      toggleButton.textContent = movie.watched ? "Nochmal" : "Gesehen";
      toggleButton.addEventListener("click", () => {
        movie.watched = !movie.watched;
        movies = movies.filter((item) => item !== movie);
        movies.push(movie); // ans Ende der Liste
        li.remove();
        show(movie);
        save();
      });

      // Film loeschen
      const removeButton = document.createElement("button");
      removeButton.className = "remove";
      removeButton.innerHTML = "&times;";
      removeButton.addEventListener("click", () => {
        movies = movies.filter((item) => item !== movie);
        li.remove();
        save();
      });

      li.append(poster, title, toggleButton, removeButton);

      const list = movie.watched ? watchedList : watchList;
      list.append(li);
    }

    function addMovie() {
      const title = input.value.trim();
      if (title === "") return;

      const movie = { title: title, watched: false };
      movies.push(movie);
      show(movie);
      save();
      input.value = "";
      input.focus();
    }

    addButton.addEventListener("click", addMovie);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addMovie();
    });

    movies.forEach(show);
    save();
  </script>
</body>
</html>
